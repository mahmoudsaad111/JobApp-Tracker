version: '3.8'
services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - web
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__SQLServer=Server=mssql,1433;Database=JobAppTracker;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True
      # ── Email ──────────────────────────────────────────────
      - Email__SmtpServer=smtp.gmail.com
      - Email__Port=587
      - Email__SenderName=JobAppTracker
      - Email__SenderEmail=${EMAIL_SENDER_EMAIL:-no-reply@jobapptracker.local}
      - Email__Password=${EMAIL_PASSWORD}
      # ── Frontend ───────────────────────────────────────────
      - Frontend__BaseUrl=http://localhost:4200
      # nginx sits in front of the API: trust X-Forwarded-For so rate limits are per real client
      - ForwardedHeaders__Enabled=true
      # ── External Services ──────────────────────────────────
      - Gemini__ApiKey=${Gemini__ApiKey}
    volumes:
      - uploads-data:/app/App_Data/uploads

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-server
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Developer
    volumes:
      - mssql-data:/var/opt/mssql
    deploy:
      resources:
        limits:
          memory: 2gb      
    restart: unless-stopped
    healthcheck:
         test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -No"]
         interval: 15s
         timeout: 10s
         retries: 10
         start_period: 60s

volumes:
  mssql-data:
  uploads-data:
