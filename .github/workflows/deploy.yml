name: Deploy to Monster Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-monster
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: windows-latest

    env:
      DOTNET_VERSION: '10.0.x'
      NODE_VERSION: '20'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore backend/JobAppTracker.sln

      - name: Run backend tests
        run: dotnet test backend/JobAppTracker.sln --configuration Release --no-restore --verbosity minimal

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build:prod

      - name: Publish backend application
        run: |
          dotnet publish backend/src/JobAppTracker.API/JobAppTracker.API.csproj `
            -c Release `
            -o ./publish `
            --nologo

      # No separate EF Core migration step here — Program.cs already calls
      # dbContext.Database.Migrate() on startup, so migrations apply
      # automatically the moment the deployed app connects to the database.

      - name: Prepare static frontend files
        shell: pwsh
        run: |
          $frontendDist = Join-Path $PWD 'frontend/dist/job-tracker/browser'
          if (Test-Path $frontendDist) {
            New-Item -ItemType Directory -Path ./publish/wwwroot/client -Force | Out-Null
            Copy-Item -Path (Join-Path $frontendDist '*') -Destination ./publish/wwwroot/client -Recurse -Force
          } else {
            Write-Host "::warning::Frontend dist path '$frontendDist' not found — check your Angular project name in angular.json matches this path, or static files won't be deployed."
          }

      - name: Install Web Deploy
        shell: pwsh
        run: |
          choco feature enable -n allowGlobalConfirmation
          choco install webdeploy -y

      - name: Deploy to hosting provider
        shell: pwsh
        env:
          PUBLISH_URL: ${{ secrets.WEB_DEPLOY_PUBLISH_URL }}
          MSDEPLOY_SITE: ${{ secrets.WEB_DEPLOY_MSDEPLOY_SITE }}
          USERNAME: ${{ secrets.WEB_DEPLOY_USERNAME }}
          PASSWORD: ${{ secrets.WEB_DEPLOY_PASSWORD }}
        run: |
          $msdeploy = Get-Command msdeploy.exe -ErrorAction SilentlyContinue
          if (-not $msdeploy) {
            $candidates = @(
              'C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe',
              'C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe'
            )
            $msdeploy = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          if (-not $msdeploy) {
            throw 'msdeploy.exe was not found. Use a Windows runner or install Web Deploy before deploying.'
          }

          if ([string]::IsNullOrWhiteSpace($env:PUBLISH_URL) -or [string]::IsNullOrWhiteSpace($env:MSDEPLOY_SITE) -or [string]::IsNullOrWhiteSpace($env:USERNAME) -or [string]::IsNullOrWhiteSpace($env:PASSWORD)) {
            throw 'Missing deployment secrets. Add WEB_DEPLOY_PUBLISH_URL, WEB_DEPLOY_MSDEPLOY_SITE, WEB_DEPLOY_USERNAME, and WEB_DEPLOY_PASSWORD to GitHub Secrets.'
          }

          # Splatting a single pre-quoted string still gets mangled by PowerShell's
          # native-argument marshalling once the value itself contains embedded
          # double quotes. The only fully reliable fix is to bypass PowerShell's
          # argument parsing entirely and hand each argument straight to the
          # process via .NET's ProcessStartInfo.ArgumentList, which passes every
          # element through to the child process exactly as-is, unquoted and
          # unmodified by the shell.
          $destValue = "contentPath=$env:MSDEPLOY_SITE,computerName=https://$env:PUBLISH_URL/msdeploy.axd?site=$env:MSDEPLOY_SITE,userName=$env:USERNAME,password=$env:PASSWORD,authtype=Basic"

          # $msdeploy is a CommandInfo object when found via Get-Command, but a
          # plain path string when found via the candidates fallback above.
          # Normalize to a path string either way before using it as FileName.
          $msdeployPath = if ($msdeploy -is [System.Management.Automation.CommandInfo]) { $msdeploy.Source } else { $msdeploy }

          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $msdeployPath
          $psi.ArgumentList.Add('-verb:sync')
          $psi.ArgumentList.Add("-source:contentPath=$PWD\publish")
          $psi.ArgumentList.Add("-dest:$destValue")
          $psi.ArgumentList.Add('-allowUntrusted')
          $psi.ArgumentList.Add('-disableLink:AppPoolExtension')
          $psi.ArgumentList.Add('-disableLink:ContentExtension')
          $psi.ArgumentList.Add('-enableRule:DoNotDeleteRule')
          # AppOffline drops an app_offline.htm marker before syncing, which
          # makes IIS gracefully unload the running .NET process and release
          # its lock on JobAppTracker.API.dll (fixes ERROR_FILE_IN_USE), then
          # removes the marker automatically once the sync completes.
          $psi.ArgumentList.Add('-enableRule:AppOffline')
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true

          $process = [System.Diagnostics.Process]::Start($psi)
          $stdout = $process.StandardOutput.ReadToEnd()
          $stderr = $process.StandardError.ReadToEnd()
          $process.WaitForExit()

          Write-Host $stdout
          if ($stderr) { Write-Host $stderr }

          if ($process.ExitCode -ne 0) {
            throw "msdeploy failed with exit code $($process.ExitCode)"
          }