name: CI/CD Pipeline
on: 
    push:
        branches:
        - main
    pull_request:
        branches:
        - main

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '8.0.x'

            - name: Restore dependencies
              run: dotnet restore backend/JobAppTracker.sln

            - name: Build
              run: dotnet build backend/JobAppTracker.sln --configuration Release --no-restore

            - name: Run unit tests
              run: dotnet test backend/JobAppTracker.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v3
              with:
                  name: test-results
                  path: '**/test-results.trx'