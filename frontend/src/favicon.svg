<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- app-icon background, rounded square to match the sidebar brand mark -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- briefcase handle -->
  <path d="M25 23v-3.5a7 7 0 0 1 14 0V23"
        fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/>

  <!-- briefcase body -->
  <rect x="13" y="23" width="38" height="25" rx="5" fill="#ffffff"/>

  <!-- case seam -->
  <rect x="13" y="33.5" width="38" height="3" fill="url(#bg)" opacity="0.32"/>

  <!-- clasp -->
  <rect x="28.5" y="31.5" width="7" height="7" rx="1.6" fill="url(#bg)"/>

  <!-- "tracked / accepted" status badge -->
  <circle cx="47" cy="47" r="11.5" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M42 47.2l3.4 3.4 6.6-7.4" fill="none" stroke="#ffffff"
        stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
